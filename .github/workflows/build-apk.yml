
name: Build KasirBasic APK

on:
  push:
    branches: [main, refactor/phase-1a-foundation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project structure
        run: |
          flutter create \
            --platforms=android \
            --project-name kasirbasic \
            --org com.kasirbasic \
            /tmp/kasir_scaffold
          cp -R /tmp/kasir_scaffold/android ./android

      - name: Configure permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/kasirbasic-release.jks
          chmod 600 android/app/kasirbasic-release.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=kasirbasic-release.jks
          EOF

          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          content = path.read_text()

          imports = (
              "import java.io.FileInputStream\n"
              "import java.util.Properties\n\n"
          )
          content = imports + content

          load_properties = """
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """

          if "val keystoreProperties = Properties()" not in content:
              content = content.replace("android {", load_properties + "android {", 1)

          signing_config = """
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """

          if 'create("release")' not in content:
              content = content.replace("    buildTypes {", signing_config + "    buildTypes {", 1)

          debug_config = 'signingConfig = signingConfigs.getByName("debug")'
          release_config = 'signingConfig = signingConfigs.getByName("release")'

          if debug_config not in content:
              raise SystemExit("Default release signing configuration was not found.")

          content = content.replace(debug_config, release_config, 1)
          path.write_text(content)
          print("Permanent release signing configured.")
          PY

            - name: Install dependencies
        run: flutter pub get

      - name: Verify dependencies
        run: flutter pub deps

      - name: Generate app launcher icons
        run: dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirBasic-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/kasirbasic-release.jks
