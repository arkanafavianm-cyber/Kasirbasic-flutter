name: kasirbasic
description: Aplikasi kasir offline untuk UMKM.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  image: ^4.12.0
  file_picker: ^12.3.0
  print_bluetooth_thermal: ^1.2.5
  esc_pos_utils_plus: ^2.0.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/kasirbasic_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#064E3B"
  adaptive_icon_foreground: "assets/images/kasirbasic_icon.png"
